<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Driver Dashboard - Shift Carpool</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-container": "#ebe0db",
                    "on-primary-container": "#636466",
                    "outline": "#8f9194",

                    "error": "#ffb4ab",
                    "surface-container-low": "#1c1b1b",
                    "inverse-on-surface": "#313030",
                    "surface-variant": "#353434",
                    "primary-fixed-dim": "#c6c6c8",
                    "background": "#141313",
                    "on-secondary-fixed": "#1b1b1d",
                    "tertiary-fixed-dim": "#cec5bf",
                    "primary-container": "#e2e2e4",
                    "secondary-container": "#474649",
                    "on-tertiary-fixed-variant": "#4c4641",
                    "on-tertiary-container": "#6a635e",
                    "secondary": "#c8c6c8",
                    "secondary-fixed-dim": "#c8c6c8",
                    "on-secondary": "#303032",
                    "error-container": "#93000a",
                    "primary": "#ffffff",
                    "on-primary": "#2f3132",
                    "on-tertiary-fixed": "#1f1b17",
                    "primary-fixed": "#e2e2e4",
                    "on-secondary-fixed-variant": "#474649",
                    "surface-dim": "#141313",
                    "on-surface-variant": "#c5c7c9",
                    "tertiary-fixed": "#ebe0db",
                    "on-primary-fixed-variant": "#454749",
                    "on-secondary-container": "#b6b4b7",
                    "surface-bright": "#3a3939",
                    "on-tertiary": "#352f2c",
                    "surface-tint": "#c6c6c8",
                    "on-surface": "#e5e2e1",
                    "inverse-surface": "#e5e2e1",
                    "on-error-container": "#ffdad6",
                    "surface-container-lowest": "#0e0e0e",
                    "secondary-fixed": "#e4e2e4",
                    "surface-container": "#201f1f",
                    "tertiary": "#ffffff",
                    "on-primary-fixed": "#1a1c1d",
                    "surface": "#141313",
                    "on-error": "#690005",
                    "on-background": "#e5e2e1",
                    "outline-variant": "#44474a",
                    "inverse-primary": "#5d5e60"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "4px",
                    "container-padding": "20px",
                    "lg": "24px",
                    "md": "16px",
                    "xs": "8px",
                    "xl": "32px",
                    "sm": "12px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "display": [
                            "Inter"
                    ],
                    "body-sm": [
                            "Inter"
                    ],
                    "label-caps": [

                    ],
                    "title-md": [

                    "headline-lg": [

                    ],
                    "headline-lg-mobile": [

            },
            "fontSize": {
                    "display": [
                            "40px",

                    ],
                    "body-sm": [

                    "title-md": [

                    "headline-lg": [

                                    "fontWeight": "400"

                    ]
            }

        },
      }
    </script>
<style>
        /* Quiet Luxury thin icons */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 200, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-sm antialiased min-h-screen flex flex-col pb-32">
<!-- TopAppBar -->
<header class="w-full sticky top-0 bg-background flex justify-between items-center px-container-padding py-md transition-all duration-300 ease-in-out z-40">
<div class="flex items-center gap-md">
<button class="text-primary hover:opacity-80 transition-opacity flex items-center justify-center p-sm -ml-sm rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display text-headline-lg-mobile font-semibold text-primary">Shift Carpool</h1>
</div>
<button class="text-primary hover:opacity-80 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-container-padding pt-sm pb-xl max-w-2xl mx-auto w-full flex flex-col gap-lg">
<!-- Page Title & Context Switcher -->
<section class="flex flex-col gap-md">
<h2 class="font-display text-headline-lg-mobile text-primary">Publish Morning Route</h2>
<!-- Pill Toggle -->
<div class="bg-surface-container rounded-full p-1 flex relative w-full border border-surface-variant">
<button class="flex-1 py-sm font-label-caps text-label-caps text-on-surface-variant text-center rounded-full z-10 transition-colors duration-300">Rider Mode</button>
<button class="flex-1 py-sm font-label-caps text-label-caps text-on-primary bg-primary text-center rounded-full z-10 transition-colors duration-300">Driver Mode</button>
</div>
</section>
<!-- Form Area (Bento Box) -->
<section class="bg-surface-container-low rounded-xl p-container-padding border border-surface-variant flex flex-col gap-md">
<!-- Field 1: Origin -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Starting Point / Origin</label>
<div class="flex items-center bg-background rounded-lg border border-surface-variant p-sm focus-within:border-primary transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="location_on">location_on</span>
<input class="bg-transparent border-none outline-none text-on-surface w-full font-body-lg text-body-lg placeholder-on-surface-variant" placeholder="Enter pickup location" type="text" value="123 Serenity Lane, Hillsboro"/>
</div>
</div>
<!-- Vertical Connector (Visual only) -->
<div class="w-full flex px-md py-base">
<div class="w-px h-8 bg-surface-variant ml-1"></div>
</div>
<!-- Field 2: Destination -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Drop-off Destination</label>
<div class="flex items-center bg-background rounded-lg border border-surface-variant p-sm focus-within:border-primary transition-colors">
<span class="material-symbols-outlined text-primary mr-sm" data-icon="flag">flag</span>
<input class="bg-transparent border-none outline-none text-on-surface w-full font-body-lg text-body-lg placeholder-on-surface-variant" placeholder="Enter destination" type="text" value="Downtown Financial District"/>
</div>
</div>
<!-- Field 3: Departure Window -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Departure Window</label>
<button class="flex items-center justify-between bg-background rounded-lg border border-surface-variant p-sm hover:border-primary transition-colors w-full text-left">
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="schedule">schedule</span>
<span class="font-body-lg text-body-lg text-on-surface">07:30 AM - 07:45 AM</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</button>
</div>
<!-- Field 4: Seats -->
<div class="flex flex-col gap-xs mt-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Available Passenger Seats</label>
<div class="flex items-center justify-between bg-background rounded-lg border border-surface-variant p-sm">
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant mr-sm" data-icon="airline_seat_recline_normal">airline_seat_recline_normal</span>
<span class="font-body-lg text-body-lg text-on-surface">Seats</span>
</div>
<div class="flex items-center gap-md">
<button class="w-8 h-8 rounded-full border border-surface-variant flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<span class="font-title-md text-title-md text-primary w-4 text-center">2</span>
<button class="w-8 h-8 rounded-full border border-surface-variant flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
</div>
</section>
<!-- Bottom Action -->
<div class="mt-auto pt-lg">
<button class="w-full bg-primary text-on-primary font-title-md text-title-md py-md rounded-lg hover:opacity-90 transition-opacity flex items-center justify-center gap-sm">
<span class="material-symbols-outlined filled" data-icon="sensors">sensors</span>
                Broadcast Route Live
            </button>
<button class="w-full mt-sm bg-transparent text-on-surface-variant font-label-caps text-label-caps py-sm rounded-lg hover:bg-surface-variant transition-colors flex items-center justify-center gap-xs uppercase tracking-wider">
<span class="material-symbols-outlined" data-icon="close">close</span>
    Cancel Active Route
</button></div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-lg pb-lg pt-md bg-surface-container-low border-t-0 rounded-t-xl md:hidden">
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-xs py-xs hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-200" data-icon="explore">explore</span>
<span class="font-label-caps text-label-caps mt-1">Explore</span>
</a>
<!-- Active Tab: My Route -->
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-xs py-xs scale-95 transition-transform duration-200 w-16 h-16 shadow-lg shadow-black/20" href="#">
<span class="material-symbols-outlined filled" data-icon="directions_car">directions_car</span>
<span class="font-label-caps text-label-caps mt-1 sr-only">My Route</span>
</a>
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-on-surface-variant px-xs py-xs hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform duration-200" data-icon="person">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
</a>
</nav>
</body></html>
