<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Shift Carpool</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#ebe0db",
                        "surface": "#141313",
                        "primary": "#ffffff",
                        "secondary": "#c8c6c8",
                        "primary-fixed": "#e2e2e4",
                        "surface-bright": "#3a3939",
                        "on-background": "#e5e2e1",
                        "inverse-primary": "#5d5e60",
                        "on-tertiary": "#352f2c",
                        "on-surface": "#e5e2e1",
                        "on-primary-fixed": "#1a1c1d",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-secondary": "#303032",
                        "on-primary": "#2f3132",
                        "inverse-on-surface": "#313030",
                        "tertiary": "#ffffff",
                        "surface-container": "#201f1f",
                        "on-surface-variant": "#c5c7c9",
                        "surface-dim": "#141313",
                        "outline": "#8f9194",
                        "primary-fixed-dim": "#c6c6c8",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-tertiary-fixed-variant": "#4c4641",
                        "secondary-fixed": "#e4e2e4",
                        "primary-container": "#e2e2e4",
                        "surface-container-low": "#1c1b1b",
                        "on-primary-container": "#636466",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#6a635e",
                        "outline-variant": "#44474a",
                        "error": "#ffb4ab",
                        "tertiary-fixed": "#ebe0db",
                        "error-container": "#93000a",
                        "background": "#141313",
                        "surface-variant": "#353434",
                        "on-primary-fixed-variant": "#454749",
                        "inverse-surface": "#e5e2e1",
                        "surface-tint": "#c6c6c8",
                        "on-tertiary-fixed": "#1f1b17",
                        "secondary-container": "#474649",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary-fixed-variant": "#474649",
                        "on-secondary-container": "#b6b4b7",
                        "surface-container-highest": "#353434",
                        "surface-container-high": "#2a2a2a",
                        "tertiary-fixed-dim": "#cec5bf"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "xs": "8px",
                        "sm": "12px",
                        "container-padding": "20px",
                        "base": "4px",
                        "gutter": "16px",
                        "lg": "24px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "title-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-caps": ["Inter"],
                        "display": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "1.25", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "title-md": ["20px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center p-container-padding antialiased">
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-20%] left-[-10%] w-[70vw] h-[70vw] rounded-full bg-surface-container-high opacity-20 blur-[120px]"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-surface-variant opacity-10 blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[420px] relative z-10 flex flex-col gap-xl">
<!-- Header Section -->
<header class="flex flex-col gap-sm text-center">
<h1 class="font-display text-display md:text-display text-primary tracking-tight">Shift</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Request access to quiet luxury travel.</p>
</header>
<!-- Bento Form Card -->
<form class="bg-surface-container-low rounded-xl p-lg md:p-xl flex flex-col gap-lg border border-outline-variant/30">
<div class="flex flex-col gap-md">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative">
<input class="w-full bg-surface-container border border-outline-variant/50 rounded-lg px-md py-sm font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary transition-colors" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-surface-container border border-outline-variant/50 rounded-lg px-md py-sm font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary transition-colors" id="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<!-- Phone Number Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="phone">Phone Number</label>
<div class="relative">
<input class="w-full bg-surface-container border border-outline-variant/50 rounded-lg px-md py-sm font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary transition-colors" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container border border-outline-variant/50 rounded-lg px-md py-sm pr-[48px] font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary transition-colors" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-xs" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-md pt-xs">
<button class="w-full bg-primary text-on-primary rounded-lg py-sm px-md font-title-md text-title-md hover:bg-primary-fixed transition-colors flex items-center justify-center gap-xs" type="button">
                    Join Shift
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_right_alt">arrow_right_alt</span>
</button>
<div class="text-center">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors" href="#">
                        Already have an account? <span class="text-primary border-b border-primary/30 pb-[1px]">Log in</span>
</a>
</div>
</div>
</form>
<!-- Subtle Footer Trust Mark -->
<div class="flex justify-center items-center gap-xs text-on-surface-variant/50">
<span class="material-symbols-outlined text-[16px]" data-icon="verified_user">verified_user</span>
<span class="font-label-caps text-label-caps">Secure Onboarding</span>
</div>
</main>
</body></html>
