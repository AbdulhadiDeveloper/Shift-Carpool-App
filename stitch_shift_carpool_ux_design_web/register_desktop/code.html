<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Shift Carpool</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            theme: {

                        "secondary-fixed-dim": "#c8c6c8",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#4c4641",
                        "error": "#ffb4ab",
                        "on-background": "#e5e2e1",
                        "on-surface-variant": "#c5c7c9",
                        "background": "#141313",
                        "surface-variant": "#353434",
                        "inverse-primary": "#5d5e60",
                        "surface-container-low": "#1c1b1b",
                        "primary-container": "#e2e2e4",
                        "outline": "#8f9194",
                        "primary-fixed": "#e2e2e4",
                        "on-primary-fixed-variant": "#454749",
                        "surface": "#141313",
                        "on-tertiary-fixed": "#1f1b17",

                    },
                    "borderRadius": {

                        "lg": "0.5rem",

                        "full": "9999px"

                    "spacing": {

                        "gutter": "16px"

                    "fontFamily": {

                        "display": ["Inter"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg selection:bg-primary selection:text-on-primary">
<main class="flex-grow flex items-center justify-center py-xl px-container-padding relative overflow-hidden">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-surface-bright via-background to-background"></div>
<!-- Registration Card -->
<div class="w-full max-w-md bg-surface-container-low border border-surface-bright rounded-xl p-xl shadow-2xl relative z-10 flex flex-col">
<div class="mb-lg text-center">
<span class="font-title-md text-title-md font-bold tracking-tight text-primary mb-xs block">Shift Carpool</span>
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Create Account</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Join the exclusive network of shared journeys.</p>
</div>
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-xs" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none text-[20px]">person</span>
<input class="w-full bg-surface border-b border-surface-bright text-on-surface font-body-lg text-body-lg px-sm py-sm pl-[44px] focus:outline-none focus:border-primary focus:bg-surface-container transition-colors duration-300 placeholder:text-surface-variant rounded-t-DEFAULT" id="fullName" name="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-xs" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none text-[20px]">mail</span>
<input class="w-full bg-surface border-b border-surface-bright text-on-surface font-body-lg text-body-lg px-sm py-sm pl-[44px] focus:outline-none focus:border-primary focus:bg-surface-container transition-colors duration-300 placeholder:text-surface-variant rounded-t-DEFAULT" id="email" name="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-xs" for="phone">Phone Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none text-[20px]">call</span>
<input class="w-full bg-surface border-b border-surface-bright text-on-surface font-body-lg text-body-lg px-sm py-sm pl-[44px] focus:outline-none focus:border-primary focus:bg-surface-container transition-colors duration-300 placeholder:text-surface-variant rounded-t-DEFAULT" id="phone" name="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider pl-xs" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant pointer-events-none text-[20px]">lock</span>
<input class="w-full bg-surface border-b border-surface-bright text-on-surface font-body-lg text-body-lg px-sm py-sm pl-[44px] focus:outline-none focus:border-primary focus:bg-surface-container transition-colors duration-300 placeholder:text-surface-variant rounded-t-DEFAULT" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="mt-lg">
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-medium py-sm px-lg rounded-full hover:bg-primary-fixed-dim transition-colors duration-300 flex justify-center items-center gap-xs" type="submit">
                        Join Shift
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already a member? 
                    <a class="text-primary hover:underline underline-offset-4 transition-all" href="#">Sign In</a>
</p>
</div>
</div>
</main>
<!-- Footer Component -->
<footer class="bg-background dark:bg-background w-full mt-auto bg-surface-container-lowest dark:bg-surface-container-lowest flat no shadows flex flex-col md:flex-row justify-between items-center py-xl px-xl border-t border-outline-variant">
<div class="text-label-caps font-label-caps text-primary mb-md md:mb-0">
            Shift Carpool
        </div>
<div class="text-on-surface-variant dark:text-on-surface-variant font-body-sm text-body-sm text-center md:text-left mb-md md:mb-0">
            © 2024 Shift Carpool. The Art of the Shared Journey.
        </div>
<nav class="flex gap-md font-body-sm text-body-sm">
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200 none" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200 none" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200 none" href="#">Help Center</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200 none" href="#">Contact</a>
</nav>
</footer>
</body></html>
