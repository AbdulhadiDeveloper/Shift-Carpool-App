<div class="bg-surface-container-low border border-outline-variant/30 rounded-xl p-xl w-full max-w-md relative z-10 shadow-2xl flex flex-col gap-lg backdrop-blur-sm">
<!-- Header -->
<div class="flex flex-col items-center gap-xs text-center">
<h1 class="font-display text-display text-primary tracking-tight">Shift Carpool</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">The Art of the Shared Journey.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md mt-sm">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-surface-container border-b border-outline-variant focus:border-primary text-on-surface font-body-lg text-body-lg pl-xl pr-sm py-sm focus:ring-0 transition-colors bg-transparent" id="email" placeholder="name@domain.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest" for="password">Password</label>
<a class="font-label-caps text-label-caps text-primary hover:text-primary-fixed-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant text-[20px]" data-icon="lock">lock</span>
<input class="w-full bg-surface-container border-b border-outline-variant focus:border-primary text-on-surface font-body-lg text-body-lg pl-xl pr-sm py-sm focus:ring-0 transition-colors bg-transparent" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-sm bg-primary text-on-primary font-title-md text-title-md py-sm px-lg rounded-full hover:bg-primary-fixed-dim transition-colors duration-300 flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->

<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary hover:text-primary-fixed-dim font-medium transition-colors border-b border-primary/30 hover:border-primary pb-base" href="#">Create an Account</a>
