<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Shift Carpool - Broadcast Route</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#474649",
                        "tertiary-fixed-dim": "#cec5bf",
                        "surface-container": "#201f1f",
                        "surface-bright": "#3a3939",
                        "tertiary-fixed": "#ebe0db",
                        "surface-tint": "#c6c6c8",
                        "inverse-on-surface": "#313030",
                        "secondary-container": "#474649",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#4c4641",
                        "error": "#ffb4ab",
                        "on-background": "#e5e2e1",
                        "on-surface-variant": "#c5c7c9",
                        "background": "#141313",
                        "surface-variant": "#353434",
                        "inverse-primary": "#5d5e60",
                        "surface-container-low": "#1c1b1b",
                        "primary-container": "#e2e2e4",
                        "outline": "#8f9194",
                        "primary-fixed": "#e2e2e4",
                        "on-primary-fixed-variant": "#454749",
                        "surface": "#141313",
                        "on-tertiary-fixed": "#1f1b17",
                        "on-surface": "#e5e2e1",
                        "surface-container-lowest": "#0e0e0e",
                        "inverse-surface": "#e5e2e1",
                        "error-container": "#93000a",
                        "surface-container-highest": "#353434",
                        "on-tertiary": "#352f2c",
                        "surface-container-high": "#2a2a2a",
                        "outline-variant": "#44474a",
                        "on-primary": "#2f3132",
                        "primary-fixed-dim": "#c6c6c8",
                        "on-primary-fixed": "#1a1c1d",
                        "primary": "#ffffff",
                        "secondary-fixed": "#e4e2e4",
                        "secondary": "#c8c6c8",
                        "tertiary-container": "#ebe0db",
                        "tertiary": "#ffffff",
                        "on-primary-container": "#636466",
                        "on-secondary-container": "#b6b4b7",
                        "surface-dim": "#141313",
                        "on-secondary-fixed": "#1b1b1d",
                        "on-error": "#690005",
                        "on-tertiary-container": "#6a635e",
                        "on-secondary": "#303032"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "12px",
                        "md": "16px",
                        "base": "4px",
                        "lg": "24px",
                        "xs": "8px",
                        "xl": "32px",
                        "container-padding": "20px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "label-caps": ["Inter"],
                        "display": ["Inter"],
                        "body-lg": ["Inter"],

                        "headline-lg": ["Inter"]

                    "fontSize": {

                        "display": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],

                },
            },
        }

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #141313;
            color: #e5e2e1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .bento-card {
            background-color: #1C1C1E;
            border: 1px solid #2C2C2E;
            border-radius: 0.75rem;
            padding: 20px;
        }

        .input-field {
            background-color: #1C1C1E;
            border: none;
            border-bottom: 1px solid #44474a;
            color: #ffffff;
            width: 100%;
            padding: 12px 0;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-bottom-color: #ffffff;
            box-shadow: none;
        }

        .stepper-btn {
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #44474a;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .stepper-btn:hover {
            background-color: #353434;
        }
    </style>
</head>
<body class="bg-background text-on-surface antialiased">
<!-- TopNavBar -->
<header class="bg-background dark:bg-background w-full sticky top-0 z-50 bg-surface-container-low dark:bg-surface-container-low">
<div class="flex justify-between items-center h-20 px-xl max-w-7xl mx-auto">
<div class="flex items-center gap-xl">
<span class="text-title-md font-title-md font-bold tracking-tight text-primary dark:text-primary">Shift Carpool</span>
<nav class="hidden md:flex gap-lg font-body-lg text-body-lg">
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-80" href="#">Explore</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-80" href="#">My Journeys</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-300 cursor-pointer active:opacity-80" href="#">Profile</a>
</nav>
</div>
<div class="hidden md:block">
<button class="bg-primary text-on-primary font-body-lg text-body-lg font-medium py-sm px-lg rounded-full hover:bg-primary-fixed transition-colors">Broadcast Route</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center py-xl px-container-padding">
<div class="w-full max-w-2xl bento-card shadow-2xl">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">Broadcast Route Live</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">Share your journey and connect with fellow travelers.</p>
<form action="#" class="space-y-lg" method="POST">
<!-- Location Group -->
<div class="space-y-md">
<div class="relative">
<label class="block font-label-caps text-label-caps text-outline mb-base" for="start-location">STARTING POINT</label>
<div class="flex items-center">
<span class="material-symbols-outlined text-outline-variant mr-sm" data-icon="location_on" data-weight="fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
<input class="input-field" id="start-location" name="start-location" placeholder="Enter pickup address..." required="" type="text"/>
</div>
</div>
<div class="pl-md py-base border-l-2 border-dashed border-surface-variant ml-sm h-xs"></div>
<div class="relative">
<label class="block font-label-caps text-label-caps text-outline mb-base" for="dropoff-location">DROP-OFF DESTINATION</label>
<div class="flex items-center">
<span class="material-symbols-outlined text-outline-variant mr-sm" data-icon="flag" data-weight="fill" style="font-variation-settings: 'FILL' 1;">flag</span>
<input class="input-field" id="dropoff-location" name="dropoff-location" placeholder="Enter destination address..." required="" type="text"/>
</div>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg pt-md">
<!-- Departure Window -->
<div>
<label class="block font-label-caps text-label-caps text-outline mb-base" for="departure-time">DEPARTURE WINDOW</label>
<div class="flex items-center">
<span class="material-symbols-outlined text-outline-variant mr-sm" data-icon="schedule" data-weight="fill" style="font-variation-settings: 'FILL' 1;">schedule</span>
<input class="input-field" id="departure-time" name="departure-time" required="" type="time"/>
</div>
</div>
<!-- Passenger Seats Stepper -->
<div>
<label class="block font-label-caps text-label-caps text-outline mb-base">PASSENGER SEATS</label>
<div class="flex items-center h-full pt-sm pb-sm">
<span class="material-symbols-outlined text-outline-variant mr-sm" data-icon="airline_seat_recline_normal" data-weight="fill" style="font-variation-settings: 'FILL' 1;">airline_seat_recline_normal</span>
<div class="flex items-center space-x-md ml-auto md:ml-sm">
<button class="stepper-btn" onclick="decrementSeats()" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="remove">remove</span>
</button>
<span class="font-title-md text-title-md text-primary w-xs text-center" id="seat-count">3</span>
<button class="stepper-btn" onclick="incrementSeats()" type="button">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span>
</button>
<input id="seats-input" name="seats" type="hidden" value="3"/>
</div>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-xl mt-lg border-t border-surface-variant">
<button class="w-full bg-primary text-on-primary font-body-lg text-body-lg font-bold py-md px-lg rounded-lg hover:bg-primary-fixed transition-colors flex justify-center items-center gap-sm" type="submit">
<span class="material-symbols-outlined" data-icon="sensors" data-weight="fill" style="font-variation-settings: 'FILL' 1;">sensors</span>
                        Broadcast Route Live
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="bg-background dark:bg-background w-full mt-auto bg-surface-container-lowest dark:bg-surface-container-lowest">
<div class="flex flex-col md:flex-row justify-between items-center py-xl px-xl border-t border-outline-variant max-w-7xl mx-auto">
<div class="mb-md md:mb-0">
<span class="text-label-caps font-label-caps text-primary">Shift Carpool</span>
<span class="text-on-surface-variant dark:text-on-surface-variant font-body-sm text-body-sm ml-sm">© 2024 Shift Carpool. The Art of the Shared Journey.</span>
</div>
<nav class="flex gap-md font-body-sm text-body-sm">
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Privacy Policy</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Terms of Service</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Help Center</a>
<a class="text-on-surface-variant hover:text-primary transition-colors duration-200" href="#">Contact</a>
</nav>
</div>
</footer>
<script>
        function incrementSeats() {
            let countSpan = document.getElementById('seat-count');
            let input = document.getElementById('seats-input');
            let current = parseInt(countSpan.innerText);
            if (current < 8) {
                countSpan.innerText = current + 1;
                input.value = current + 1;
            }
        }

        function decrementSeats() {
            let countSpan = document.getElementById('seat-count');
            let input = document.getElementById('seats-input');
            let current = parseInt(countSpan.innerText);
            if (current > 1) {
                countSpan.innerText = current - 1;
                input.value = current - 1;
            }
        }
    </script>
</body></html>
